# Render.com のBlueprint（複数サービスをまとめて作成する設定ファイル）。
# 使い方: Renderダッシュボードで「New +」→「Blueprint」→ このGitHubリポジトリを選択するだけで、
# 下記のサービスとデータベースが自動的に作成される。
# APIキー等の秘密情報（sync: false のもの）は、作成後にRenderダッシュボード側で入力すること。
#
# 全サービスを有料の最小プランにしている（月額合計 約$20）。理由:
#   - 無料のWebサービスは15分アクセスがないと停止する。AWPはエージェントの定期実行・
#     SNS投稿スケジューラなど「常時動き続けること」が前提の設計のため、バックエンドは必須で有料化
#   - 無料のPostgreSQLは作成から30日で失効し、その後14日で完全に削除される
#     （顧客データが消えるリスクがあるため必須で有料化）
#   - フロントエンドは無料でも機能面の問題はない（初回アクセス時に多少の待ち時間が出るだけ）が、
#     訪問者の体験を優先し、こちらも常時起動の有料プランにしている
databases:
  - name: awp-db
    databaseName: awp
    plan: 0.1c-256mb  # $6/月・失効しない（無料プランは30日で失効・14日後に削除される）

services:
  # バックエンド（Express API・スケジューラ・AIエージェントループ・ブラウザ自動化）
  # PlaywrightがChromiumを動かすための依存関係を含めるため、通常のNode実行環境ではなくDockerでビルドする
  # （backend/Dockerfile参照。起動コマンドはDockerfileのCMDに従う）
  - type: web
    name: awp-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: 0.5c-512mb  # $7/月・常時起動（無料プランは15分アクセスがないと停止し、バックグラウンド処理が止まる）
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: awp-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        sync: false
      - key: SITE_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: INDEXNOW_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      # SMS認証（Twilio Verify）。3つそろうと有効になる。SMS_DEV_MODE は本番では絶対に設定しない
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: X_CLIENT_ID
        sync: false
      - key: X_CLIENT_SECRET
        sync: false
      - key: INSTAGRAM_CLIENT_ID
        sync: false
      - key: INSTAGRAM_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_CLIENT_ID
        sync: false
      - key: FACEBOOK_CLIENT_SECRET
        sync: false
      - key: TIKTOK_CLIENT_ID
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: CUSTOM_DOMAIN_CNAME_TARGET
        sync: false
      - key: AFF_XSERVER_DOMAIN_URL
        sync: false
      - key: AFF_XSERVER_URL
        sync: false
      # 本番では絶対に設定しない（管理者の裏口ログイン用・テスト専用）
      # ENABLE_DEV_LOGIN / DEV_LOGIN_CODE

  # フロントエンド（Next.js）
  - type: web
    name: awp-frontend
    runtime: node
    plan: 0.5c-512mb  # $7/月・常時起動（無料プランでも機能上は問題ないが、訪問者の待ち時間をなくすため）
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      # awp-backend の公開URL（Renderで確認: サービス画面右上に表示される https://awp-backend-xxxx.onrender.com）を入力
      - key: API_ORIGIN
        sync: false
      # 上と同じURLの末尾に /api を付けた値（例: https://awp-backend-xxxx.onrender.com/api）を入力
      - key: API_INTERNAL_URL
        sync: false
      - key: SITE_URL
        sync: false
      - key: MAIN_HOSTS
        sync: false
      # 事業者ごとのサブドメイン（{slug}.MAIN_DOMAIN）を使わないうちは空欄のままでよい。
      # 設定手順は frontend/.env.example のMAIN_DOMAINのコメントを参照
      - key: MAIN_DOMAIN
        sync: false
