# AWPの管理者画面で運営者が承認した実装依頼（ラベル "claude" の付いた課題）を、
# Claude Code が GitHub Actions の隔離された環境で実装し、プルリクエストとして提出する。
# 本番への反映は、運営者がプルリクエストを確認してマージしたときだけ（Render が main を自動デプロイ）。
#
# 必要な設定（運営者が行う）:
# - リポジトリの Settings → Secrets and variables → Actions に ANTHROPIC_API_KEY を登録
# - Claude の GitHub App をこのリポジトリにインストール（https://github.com/apps/claude）
# 書き込み権限のあるユーザー（運営者・運営者のトークン）からの依頼だけが実行される（アクションの既定）
name: Claude Code

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'claude') ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          label_trigger: claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
