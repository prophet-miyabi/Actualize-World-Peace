# AWPのローンチ・クルー（Discord）や管理者画面から依頼された実装（ラベル "claude" の付いた課題）と、
# PRへのレビュー依頼（"@claude" を含むコメント）を、Claude Code が GitHub Actions の隔離された環境で実行する。
# 本番への反映は、運営者がプルリクエストを確認してマージしたときだけ（Render が main を自動デプロイ）。
#
# 必要な設定（運営者が行う）:
# - Claude Max プランで `claude setup-token` を実行し、出たトークンを
#   リポジトリの Settings → Secrets and variables → Actions に CLAUDE_CODE_OAUTH_TOKEN として登録
# - Claude の GitHub App をこのリポジトリにインストール（https://github.com/apps/claude）
# 書き込み権限のあるユーザー（運営者・運営者のトークン）からの依頼だけが実行される（アクションの既定）
name: Claude Code

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'claude') ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 型チェック（npx tsc --noEmit）を実行できるよう、依存関係を先に入れておく
      - name: Install dependencies
        run: |
          cd backend && npm ci && npx prisma generate && cd ..
          cd frontend && npm ci
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: claude
          claude_args: >-
            --allowedTools "Bash(npx tsc:*),Bash(npx prisma generate:*),Bash(npx prisma validate:*),Bash(npm run build:*),Bash(git diff:*),Bash(git log:*),Bash(git status:*)"
