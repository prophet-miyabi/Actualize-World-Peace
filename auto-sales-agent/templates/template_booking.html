<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{brand}} 予約・顧客管理（プロトタイプ）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
<script id="brief" type="application/json">{{brief_json}}</script>
<style>
  :root { --primary: {{primary}}; --accent: {{accent}}; }
  body { font-family: 'Noto Sans JP', system-ui, sans-serif; }
  .bg-primary { background: var(--primary); } .text-primary { color: var(--primary); } .border-primary { border-color: var(--primary); }
  [x-cloak] { display: none !important; }
  .chip { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 9999px; white-space: nowrap; }
  .slot { transition: transform .12s ease; } .slot:active { transform: scale(.97); }
</style>
</head>
<body class="bg-slate-50 text-slate-800" x-data="booking()" x-init="init()">

<header class="h-16 bg-white border-b border-slate-200 px-4 md:px-6 flex items-center gap-3 sticky top-0 z-30">
  <span class="w-8 h-8 rounded-lg bg-primary text-white font-black flex items-center justify-center text-sm" x-text="brand.slice(0,1)"></span>
  <div class="min-w-0"><p class="font-black text-sm truncate">{{brand}}</p><p class="text-[11px] text-slate-500 hidden sm:block">予約・顧客管理（{{industry}}）</p></div>
  <nav class="ml-4 hidden md:flex gap-1 text-sm">
    <template x-for="t in tabs" :key="t.id"><button @click="tab = t.id" class="px-3 py-2 rounded-xl font-bold" :class="tab === t.id ? 'bg-primary text-white' : 'text-slate-600 hover:bg-slate-100'" x-text="t.label"></button></template>
  </nav>
  <button @click="openNew()" class="ml-auto bg-primary text-white text-sm font-bold px-4 py-2 rounded-full shadow-sm">＋ 予約を追加</button>
</header>
<div class="md:hidden flex gap-2 px-4 py-3 overflow-x-auto bg-white border-b border-slate-100">
  <template x-for="t in tabs" :key="t.id"><button @click="tab = t.id" class="px-3 py-1.5 rounded-full text-xs font-bold whitespace-nowrap" :class="tab === t.id ? 'bg-primary text-white' : 'bg-slate-100 text-slate-600'" x-text="t.label"></button></template>
</div>

<main class="max-w-7xl mx-auto p-4 md:p-6 space-y-5">

  <!-- カレンダー（週） -->
  <section x-show="tab === 'cal'" class="space-y-4">
    <div class="flex flex-wrap items-center gap-2">
      <button @click="shiftWeek(-1)" class="px-3 py-1.5 rounded-full border bg-white text-sm">‹ 前の週</button>
      <p class="font-bold" x-text="weekLabel"></p>
      <button @click="shiftWeek(1)" class="px-3 py-1.5 rounded-full border bg-white text-sm">次の週 ›</button>
      <select x-model="staffFilter" class="ml-auto border border-slate-200 rounded-full px-3 py-1.5 text-xs bg-white"><option value="">{{unit_staff}}: 全員</option><template x-for="s in staff" :key="s.name"><option :value="s.name" x-text="s.name"></option></template></select>
      <div class="flex items-center gap-3 text-[11px] text-slate-500"><span class="inline-flex items-center gap-1"><i class="w-3 h-3 rounded bg-emerald-100 border border-emerald-300"></i>空き</span><span class="inline-flex items-center gap-1"><i class="w-3 h-3 rounded bg-primary"></i>予約済み</span><span class="inline-flex items-center gap-1"><i class="w-3 h-3 rounded bg-slate-200"></i>休み</span></div>
    </div>
    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-x-auto">
      <div class="min-w-[640px] grid" style="grid-template-columns: 56px repeat(7, 1fr);">
        <div class="p-2"></div>
        <template x-for="day in week" :key="day.key"><div class="p-2 text-center border-l border-slate-100"><p class="text-[11px] text-slate-500" x-text="day.wd"></p><p class="font-bold" :class="day.today && 'text-primary'" x-text="day.d"></p></div></template>
        <template x-for="h in hours" :key="h">
          <template x-for="(cell, ci) in rowCells(h)" :key="h + '-' + ci">
            <div :class="ci === 0 ? 'p-2 text-[11px] text-slate-500 text-right' : 'p-1 border-l border-t border-slate-100'">
              <template x-if="ci === 0"><span x-text="h + ':00'"></span></template>
              <template x-if="ci > 0">
                <button @click="cell.booking ? open(cell.booking) : (cell.closed ? null : newAt(cell.day, h))" class="slot w-full h-12 rounded-lg text-[11px] font-bold leading-tight px-1 text-left" :class="cell.booking ? 'bg-primary text-white' : cell.closed ? 'bg-slate-100 text-slate-300 cursor-not-allowed' : 'bg-emerald-50 text-emerald-700 border border-dashed border-emerald-300 hover:bg-emerald-100'">
                  <template x-if="cell.booking"><span class="block truncate" x-text="cell.booking.customer + '／' + cell.booking.staff"></span></template>
                  <template x-if="!cell.booking && !cell.closed"><span>空き</span></template>
                </button>
              </template>
            </div>
          </template>
        </template>
      </div>
    </div>
    <p class="text-xs text-slate-500">空き枠を押すと予約フォームが開きます。予約済みの枠を押すと詳細を確認・変更できます。</p>
  </section>

  <!-- 予約一覧 -->
  <section x-show="tab === 'list'" class="space-y-3">
    <div class="flex flex-wrap gap-2 items-center">
      <input x-model="q" placeholder="顧客名・{{unit_staff}}・メニューで検索" class="border border-slate-200 rounded-full px-4 py-2 text-sm w-full sm:w-72">
      <template x-for="s in bookingStatuses" :key="s"><button @click="filter = filter === s ? '' : s" class="px-3 py-1.5 rounded-full text-xs font-bold border" :class="filter === s ? 'bg-slate-900 text-white border-transparent' : 'bg-white border-slate-200'" x-text="s + ' ' + bookings.filter(b => b.status === s).length"></button></template>
    </div>
    <div class="space-y-2">
      <template x-for="b in filteredBookings" :key="b.id">
        <div class="bg-white rounded-2xl border border-slate-100 p-4 shadow-sm flex flex-col sm:flex-row sm:items-center gap-3" :class="isBlacklisted(b.customer) && 'border-rose-300'">
          <div class="font-mono text-xs text-slate-500 w-28" x-text="b.date + ' ' + b.time"></div>
          <div class="min-w-0 flex-1"><p class="font-bold flex items-center gap-2"><span x-text="b.customer"></span><span x-show="isBlacklisted(b.customer)" class="chip bg-rose-100 text-rose-700">要注意</span></p><p class="text-xs text-slate-500" x-text="b.menu + '／' + b.staff + '／' + b.price"></p></div>
          <select :value="b.status" @change="setStatus(b, $event.target.value)" class="chip border-0" :style="chipStyle(b.status)"><template x-for="s in bookingStatuses" :key="s"><option :value="s" x-text="s"></option></template></select>
          <button @click="open(b)" class="text-xs font-bold text-primary">詳細</button>
        </div>
      </template>
      <p x-show="filteredBookings.length === 0" class="text-center text-slate-400 text-sm py-8">該当する予約はありません</p>
    </div>
  </section>

  <!-- 顧客管理 -->
  <section x-show="tab === 'customers'" class="space-y-3">
    <div class="flex flex-wrap gap-2 items-center">
      <input x-model="cq" placeholder="顧客名・メモで検索" class="border border-slate-200 rounded-full px-4 py-2 text-sm w-full sm:w-72">
      <label class="inline-flex items-center gap-2 text-sm"><input type="checkbox" x-model="onlyBlack"> 要注意（ブラックリスト）のみ</label>
      <span class="ml-auto text-xs text-slate-500" x-text="customers.length + ' 名'"></span>
    </div>
    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-3">
      <template x-for="c in filteredCustomers" :key="c.name">
        <div class="bg-white rounded-2xl border p-4 shadow-sm" :class="c.black ? 'border-rose-300 bg-rose-50/40' : 'border-slate-100'">
          <div class="flex items-start justify-between gap-2">
            <div><p class="font-bold" x-text="c.name"></p><p class="text-xs text-slate-500" x-text="'来店 ' + c.visits + ' 回・最終 ' + c.last"></p></div>
            <button @click="toggleBlack(c)" class="chip" :class="c.black ? 'bg-rose-600 text-white' : 'bg-slate-100 text-slate-600'" x-text="c.black ? '要注意 解除' : '要注意にする'"></button>
          </div>
          <p class="text-sm text-slate-600 mt-2" x-text="c.memo"></p>
          <div class="flex items-center gap-2 mt-3 text-xs">
            <span class="chip bg-slate-100 text-slate-600" x-text="'指名: ' + (c.fav || 'なし')"></span>
            <span class="chip" :class="c.noShow ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700'" x-text="c.noShow ? '無断キャンセル ' + c.noShow + ' 回' : 'キャンセルなし'"></span>
          </div>
          <div class="mt-3 flex gap-2"><input :id="'memo-' + c.name" placeholder="メモを追加" class="flex-1 border rounded-xl px-3 py-1.5 text-xs"><button @click="addMemo(c)" class="text-xs font-bold text-primary">追加</button></div>
        </div>
      </template>
    </div>
  </section>

  <!-- スタッフ（キャスト） -->
  <section x-show="tab === 'staff'" class="grid md:grid-cols-2 lg:grid-cols-3 gap-3">
    <template x-for="s in staff" :key="s.name">
      <div class="bg-white rounded-2xl border border-slate-100 p-4 shadow-sm">
        <div class="flex items-center gap-3"><span class="w-11 h-11 rounded-full text-white font-black flex items-center justify-center" :style="`background:${s.color}`" x-text="s.name.slice(0,1)"></span><div><p class="font-bold" x-text="s.name"></p><p class="text-xs text-slate-500" x-text="s.role"></p></div><label class="ml-auto inline-flex items-center gap-1 text-xs"><input type="checkbox" x-model="s.active"> 出勤</label></div>
        <div class="mt-3 grid grid-cols-3 gap-2 text-center text-xs">
          <div class="bg-slate-50 rounded-xl p-2"><p class="text-slate-500">今週の予約</p><p class="font-black text-lg" x-text="bookings.filter(b => b.staff === s.name && b.status !== 'キャンセル').length"></p></div>
          <div class="bg-slate-50 rounded-xl p-2"><p class="text-slate-500">指名</p><p class="font-black text-lg" x-text="customers.filter(c => c.fav === s.name).length"></p></div>
          <div class="bg-slate-50 rounded-xl p-2"><p class="text-slate-500">評価（見本）</p><p class="font-black text-lg">—</p></div>
        </div>
        <p class="text-[11px] text-slate-500 mt-3" x-text="'対応メニュー: ' + (s.menus || menu.map(m => m.name)).slice(0, 3).join('・')"></p>
      </div>
    </template>
  </section>
</main>

<!-- 予約モーダル（新規 / 詳細） -->
<div x-show="modal" x-cloak class="fixed inset-0 z-50 flex items-end md:items-center justify-center bg-black/50 md:p-6" @keydown.escape.window="modal = null">
  <div class="bg-white w-full md:max-w-lg rounded-t-3xl md:rounded-3xl shadow-2xl max-h-[92vh] overflow-y-auto" @click.outside="modal = null">
    <template x-if="modal">
      <div>
        <div class="p-5 border-b border-slate-100 flex items-center justify-between"><p class="font-black" x-text="modal.id ? '予約の詳細' : '新しい予約'"></p><button @click="modal = null" class="text-slate-400 text-xl">×</button></div>
        <div class="p-5 space-y-3 text-sm">
          <div x-show="modal.customer && isBlacklisted(modal.customer)" class="rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-bold p-3">この顧客は「要注意」に登録されています。受付前に顧客メモを確認してください。</div>
          <div class="grid grid-cols-2 gap-2">
            <div><p class="text-xs text-slate-500 mb-1">日付</p><input type="date" x-model="modal.date" class="w-full border rounded-xl px-3 py-2"></div>
            <div><p class="text-xs text-slate-500 mb-1">時間</p><select x-model="modal.time" class="w-full border rounded-xl px-3 py-2"><template x-for="h in hours" :key="h"><option :value="h + ':00'" x-text="h + ':00'"></option></template></select></div>
          </div>
          <div><p class="text-xs text-slate-500 mb-1">顧客名</p><input x-model="modal.customer" list="customers" placeholder="お名前" class="w-full border rounded-xl px-3 py-2"><datalist id="customers"><template x-for="c in customers" :key="c.name"><option :value="c.name"></option></template></datalist></div>
          <div class="grid grid-cols-2 gap-2">
            <div><p class="text-xs text-slate-500 mb-1">メニュー</p><select x-model="modal.menu" @change="modal.price = (menu.find(m => m.name === modal.menu) || {}).price || ''" class="w-full border rounded-xl px-3 py-2"><template x-for="m in menu" :key="m.name"><option :value="m.name" x-text="m.name + '（' + m.price + '）'"></option></template></select></div>
            <div><p class="text-xs text-slate-500 mb-1">{{unit_staff}}</p><select x-model="modal.staff" class="w-full border rounded-xl px-3 py-2"><template x-for="s in staff.filter(s => s.active)" :key="s.name"><option :value="s.name" x-text="s.name"></option></template></select></div>
          </div>
          <div x-show="modal.id"><p class="text-xs text-slate-500 mb-1">ステータス</p><select x-model="modal.status" class="w-full border rounded-xl px-3 py-2"><template x-for="s in bookingStatuses" :key="s"><option :value="s" x-text="s"></option></template></select></div>
          <div><p class="text-xs text-slate-500 mb-1">メモ</p><textarea x-model="modal.memo" rows="2" class="w-full border rounded-xl px-3 py-2" placeholder="要望・注意点"></textarea></div>
          <p x-show="conflict(modal)" class="text-xs font-bold text-rose-600">同じ時間に同じ{{unit_staff}}の予約があります（重複）。</p>
        </div>
        <div class="p-5 border-t border-slate-100 flex gap-2">
          <button x-show="modal.id" @click="cancelBooking(modal)" class="px-4 py-3 rounded-full border text-rose-600 font-bold text-sm">キャンセル</button>
          <button @click="save()" :disabled="!modal.customer || !modal.date || !modal.time || conflict(modal)" class="flex-1 bg-primary text-white font-bold py-3 rounded-full disabled:opacity-40" x-text="modal.id ? '保存する' : '予約を確定（見本）'"></button>
        </div>
      </div>
    </template>
  </div>
</div>

<div x-show="toast" x-cloak x-transition class="fixed top-20 left-1/2 -translate-x-1/2 z-[60] bg-slate-900 text-white text-sm font-bold px-5 py-3 rounded-full shadow-xl" x-text="toast"></div>
<div class="fixed right-3 bottom-3 z-40 text-[10px] font-bold bg-slate-900/80 text-white rounded-full px-2.5 py-1">プロトタイプ（見本データ）</div>

<script>
function booking() {
  const brief = JSON.parse(document.getElementById('brief').textContent || '{}');
  const d = brief.demo_data || {};
  const colors = ['#2563eb', '#db2777', '#059669', '#7c3aed', '#d97706', '#0891b2'];
  const staffNames = (d.staff && d.staff.length) ? d.staff : ['あおい', 'みさき', 'りん', 'ゆい'];
  const staff = staffNames.map((n, i) => ({ name: n, role: ['店長', 'スタッフ', 'スタッフ', '新人'][i] || 'スタッフ', color: colors[i % colors.length], active: true }));
  const menu = (d.menu && d.menu.length) ? d.menu : [{ name: '60分コース', price: '¥6,000' }, { name: '90分コース', price: '¥9,000' }, { name: '120分コース', price: '¥12,000' }, { name: '指名料', price: '¥1,000' }];
  const names = ['田中 様', '佐藤 様', '鈴木 様', '高橋 様', '伊藤 様', '渡辺 様', '山本 様', '中村 様', '小林 様', '加藤 様'];
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const iso = (dt) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
  const hours = Array.from({ length: 11 }, (_, i) => 10 + i);
  const seed = [];
  for (let i = 0; i < 18; i++) { const dt = new Date(today); dt.setDate(today.getDate() - 2 + (i % 7)); seed.push({ id: 100 + i, date: iso(dt), time: `${hours[(i * 3) % hours.length]}:00`, customer: names[i % names.length], menu: menu[i % menu.length].name, price: menu[i % menu.length].price, staff: staff[i % staff.length].name, status: i % 9 === 8 ? 'キャンセル' : (new Date(seed_date(dt)) < today ? '来店済み' : '確定'), memo: '' }); }
  function seed_date(dt) { return dt; }
  const customers = names.map((n, i) => ({ name: n, visits: (i * 7) % 12 + 1, last: iso(new Date(today.getTime() - i * 5 * 86400000)), memo: ['静かな席を希望', '強めの施術が好み', '毎回同じメニュー', '支払いはPayPay', ''][i % 5], fav: i % 3 === 0 ? staff[i % staff.length].name : '', black: i === 7, noShow: i === 7 ? 2 : 0 }));
  if (customers[7]) customers[7].memo = '無断キャンセル2回（10/3, 10/15）。予約時に前払いを案内する';
  return {
    brand: '{{brand}}', tab: 'cal', staff, menu, hours, bookings: seed, customers, q: '', cq: '', filter: '', onlyBlack: false, staffFilter: '', weekStart: startOfWeek(today), modal: null, toast: '',
    bookingStatuses: (d.statuses && d.statuses.length) ? d.statuses : ['仮予約', '確定', '来店済み', 'キャンセル'],
    tabs: [{ id: 'cal', label: '予約カレンダー' }, { id: 'list', label: '予約一覧' }, { id: 'customers', label: '顧客管理' }, { id: 'staff', label: '{{unit_staff}}' }],
    get week() { return Array.from({ length: 7 }, (_, i) => { const dt = new Date(this.weekStart); dt.setDate(this.weekStart.getDate() + i); return { key: iso(dt), d: dt.getDate(), wd: '日月火水木金土'[dt.getDay()], today: iso(dt) === iso(today), closed: dt.getDay() === 2 }; }); },
    get weekLabel() { const a = this.week[0], b = this.week[6]; return `${this.weekStart.getMonth() + 1}/${a.d} 〜 ${new Date(this.weekStart.getTime() + 6 * 86400000).getMonth() + 1}/${b.d}`; },
    rowCells(h) { return [{}, ...this.week.map((day) => ({ day: day.key, closed: day.closed, booking: this.bookings.find((b) => b.date === day.key && b.time === `${h}:00` && b.status !== 'キャンセル' && (!this.staffFilter || b.staff === this.staffFilter)) }))]; },
    get filteredBookings() { const q = this.q.trim(); return this.bookings.filter((b) => (!this.filter || b.status === this.filter) && (!q || [b.customer, b.staff, b.menu].join(' ').includes(q))).sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time)); },
    get filteredCustomers() { const q = this.cq.trim(); return this.customers.filter((c) => (!this.onlyBlack || c.black) && (!q || (c.name + c.memo).includes(q))); },
    init() {},
    shiftWeek(n) { const d2 = new Date(this.weekStart); d2.setDate(d2.getDate() + 7 * n); this.weekStart = d2; },
    isBlacklisted(name) { const c = this.customers.find((x) => x.name === name); return !!(c && c.black); },
    chipStyle(s) { const map = { '仮予約': '#d97706', '確定': '#2563eb', '来店済み': '#059669', 'キャンセル': '#64748b' }; const c = map[s] || colors[this.bookingStatuses.indexOf(s) % colors.length]; return `background: color-mix(in srgb, ${c} 14%, white); color: ${c};`; },
    open(b) { this.modal = { ...b }; },
    newAt(date, h) { this.modal = { date, time: `${h}:00`, customer: '', menu: this.menu[0].name, price: this.menu[0].price, staff: (this.staffFilter || this.staff[0].name), status: '確定', memo: '' }; },
    openNew() { this.newAt(iso(today), 10); },
    conflict(m) { return this.bookings.some((b) => b.id !== m.id && b.date === m.date && b.time === m.time && b.staff === m.staff && b.status !== 'キャンセル'); },
    save() { if (this.modal.id) { const i = this.bookings.findIndex((b) => b.id === this.modal.id); this.bookings.splice(i, 1, { ...this.modal }); this.say('予約を更新しました'); } else { this.bookings.unshift({ ...this.modal, id: Date.now() }); if (!this.customers.find((c) => c.name === this.modal.customer)) this.customers.unshift({ name: this.modal.customer, visits: 0, last: '—', memo: '新規', fav: '', black: false, noShow: 0 }); this.say('予約を確定しました（見本）。本番では確認メッセージを自動送信します'); } this.modal = null; },
    cancelBooking(m) { const b = this.bookings.find((x) => x.id === m.id); if (b) b.status = 'キャンセル'; this.modal = null; this.say('キャンセルにしました'); },
    setStatus(b, s) { b.status = s; this.say(`${b.customer} を「${s}」に変更`); },
    toggleBlack(c) { c.black = !c.black; this.say(c.black ? `${c.name} を要注意に登録しました` : `${c.name} の要注意を解除しました`); },
    addMemo(c) { const el = document.getElementById('memo-' + c.name); if (el && el.value.trim()) { c.memo = (c.memo ? c.memo + ' / ' : '') + el.value.trim(); el.value = ''; this.say('メモを追加しました'); } },
    say(m) { this.toast = m; setTimeout(() => (this.toast = ''), 2600); }
  };
  function startOfWeek(dt) { const d2 = new Date(dt); d2.setDate(d2.getDate() - d2.getDay()); return d2; }
}
</script>
</body>
</html>
